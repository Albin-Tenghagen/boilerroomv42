<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="css/advanced.css">
</head>
<body>  
    <header>
        <h1>Welcome to the Calculator</h1>
        <h2>Simple yet powerful calculator</h2>
    </header>
    
    <main>
        <article>
            <h2>First number to calculate:</h2>
            <input type="number" id="firstInput" placeholder="Enter the first number">
        </article>      
        
        <article>
            <h2>Select an operator:</h2>
            <button type="button" class="operator" onclick="chooseOperator('+')">+</button>
            <button type="button" class="operator" onclick="chooseOperator('-')">-</button>
            <button type="button" class="operator" onclick="chooseOperator('/')">/</button>
            <button type="button" class="operator" onclick="chooseOperator('*')">*</button>
            <button type="button" class="operator" onclick="chooseOperator('%')">%</button>
            <button type="button" class="operator" onclick="chooseOperator('**')">**</button>
        </article>    

        <article>
            <h2>Second number to calculate:</h2>
            <input type="number" id="secondInput" placeholder="Enter the second number">
        </article>    

        <article>
            <h2>Calculate the result</h2>
            <button onclick="calculate()">Calculate!</button>
        </article>

        <h2 id="resultDisplay">Result: </h2>
    </main>

    <script src="js/v43new.js" defer></script>   
</body>
</html>
