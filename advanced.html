<!DOCTYPE html>
<html lang="en">

<body>  
    <header>
        <h1>Välkomnen till vår kalkyl</h1>

    </header>
    
    <main>
        <article>
            <h2>Första siffran du vill kalkylera med:</h2>
            <input type="number" id='siffra1' placeholder="123 tillexempel">
        </article>    
        
        <article>
            <h2>Vilken operatör vill du använda?:</h2>
        <button type = 'text' class="operator" onclick="operator1(this)">+</button>
        <button type = 'text' class="operator" onclick="operator1(this)">-</button>
        <button type = 'text' class="operator" onclick="operator1(this)">/</button>
        <button type = 'text' class="operator" onclick="operator1(this)">*</button>
        <button type = 'text' class="operator" onclick="operator1(this)">%</button>
        <button type = 'text' class="operator" onclick="operator1(this)">**</button>
            <!-- <input type="text" id='operator' placeholder="+, -, /, *, %, **"> -->
        </article>    

        <article>
            <h2>Andra siffran du vill kalkylera med:</h2>
            <input type="number" id='siffra2' placeholder="321 tillexempel">
        </article>    
        
        </article>
            <h2>När du är klar kan du räkna ut summan</h2>
            <button onclick="kalkylator()">Räkna!</button>
        </article>
    </main>


    <script src="js/advanced.js"></script>
